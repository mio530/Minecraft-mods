name: Build VisionMod

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Sanitize ref name
        id: safe_ref
        run: echo "name=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Upload JAR
        uses: actions/upload-artifact@v6
        with:
          name: AppleskinV2-${{ steps.safe_ref.outputs.name }}
          path: build/libs/AppleskinV2-*.jar
          if-no-files-found: warn

      - name: Publish latest release
        if: success()
        run: |
          # Remove old "latest" release and tag so we can recreate them
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true
          # Create fresh release with the new JAR
          gh release create latest build/libs/AppleskinV2-*.jar \
            --title "AppleskinV2 – Latest Build" \
            --notes "Automatisch gebaut aus Branch \`${{ github.ref_name }}\` (Commit \`${{ github.sha }}\`)." \
            --prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
