plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.16-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group   = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
}

loom {
    accessWidenerPath = file("src/main/resources/visionmod.accesswidener")

    splitEnvironmentSourceSets()

    mods {
        "visionmod" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    // No sources jar: the release should contain only the runnable mod jar so
    // users can't accidentally download the (non-functional) -sources.jar.
}

jar {
    from("LICENSE") {
        rename { "${it}_visionmod" }
    }
}
