plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.16-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group   = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
}

loom {
    accessWidenerPath = file("src/main/resources/visionmod.accesswidener")

    splitEnvironmentSourceSets()

    mods {
        "visionmod" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    // No sources jar: the release should contain only the runnable mod jar so
    // users can't accidentally download the (non-functional) -sources.jar.
}

jar {
    from("LICENSE") {
        rename { "${it}_visionmod" }
    }
}

// TEMPORARY diagnostic: print the RenderType factory methods available in this
// Minecraft version, so the see-through (non-depth-tested) line type can be picked
// by name instead of guessed. Remove once the correct type is wired up.
tasks.register('dumpRenderTypes') {
    doLast {
        def urls = sourceSets.client.compileClasspath.files.collect { it.toURI().toURL() } as URL[]
        def cl = new URLClassLoader(urls, ClassLoader.systemClassLoader.parent)
        ['net.minecraft.client.renderer.rendertype.RenderTypes',
         'net.minecraft.client.renderer.RenderType'].each { name ->
            try {
                def c = Class.forName(name, false, cl)
                println "RTDUMP class ${name}"
                c.declaredMethods
                        .findAll { java.lang.reflect.Modifier.isPublic(it.modifiers) }
                        .collect { "${it.name}(${it.parameterTypes*.simpleName.join(',')})" }
                        .unique().sort()
                        .each { println "RTDUMP   ${it}" }
            } catch (Throwable t) {
                println "RTDUMP class ${name} UNAVAILABLE: ${t}"
            }
        }
    }
}
tasks.named('build') { dependsOn 'dumpRenderTypes' }
