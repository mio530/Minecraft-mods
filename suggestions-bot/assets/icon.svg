<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26282d"/>
      <stop offset="1" stop-color="#17181b"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43c46b"/>
      <stop offset="1" stop-color="#2e9850"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#3ba55d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3ba55d" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="110" fill="none" stroke="#3ba55d" stroke-opacity="0.25" stroke-width="3"/>

  <!-- suggestion speech bubble -->
  <g filter="url(#soft)">
    <path d="M150 120 h212 a40 40 0 0 1 40 40 v150 a40 40 0 0 1 -40 40 h-150 l-62 54 v-54 h0 a40 40 0 0 1 -40 -40 v-150 a40 40 0 0 1 40 -40 z"
          fill="url(#bubble)"/>
  </g>

  <!-- isometric Minecraft cube inside the bubble -->
  <g transform="translate(256 205)">
    <!-- top face -->
    <polygon points="0,-78 78,-39 0,0 -78,-39" fill="#eafff0"/>
    <!-- left face -->
    <polygon points="-78,-39 0,0 0,88 -78,49" fill="#9be6b4"/>
    <!-- right face -->
    <polygon points="78,-39 0,0 0,88 78,49" fill="#c4f2d4"/>
    <!-- pixel grid hints (top) -->
    <polyline points="-39,-58 39,-19" fill="none" stroke="#bfe9cc" stroke-width="3" stroke-opacity="0.55"/>
    <polyline points="39,-58 -39,-19" fill="none" stroke="#bfe9cc" stroke-width="3" stroke-opacity="0.55"/>
    <!-- edge accents -->
    <polyline points="-78,-39 0,0 78,-39" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
    <polyline points="0,0 0,88" fill="none" stroke="#2e9850" stroke-opacity="0.5" stroke-width="3"/>
  </g>

  <!-- upvote badge (bottom-right) -->
  <g transform="translate(372 372)">
    <circle r="66" fill="#17181b"/>
    <circle r="66" fill="none" stroke="#3ba55d" stroke-width="5"/>
    <path d="M0 -30 L30 8 H12 V34 H-12 V8 H-30 Z" fill="#43c46b"/>
  </g>
</svg>
